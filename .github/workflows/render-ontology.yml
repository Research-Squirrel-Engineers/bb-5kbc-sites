name: Render Ontology Documentation

on:
  # Läuft nachdem der Unicorn-Workflow fertig ist
  workflow_run:
    workflows: ["SPARQL Unicorn Ontology Documentation CI"]
    types:
      - completed
    branches: ["main"]
  # Manueller Trigger für Tests
  workflow_dispatch:

jobs:
  render-ontology:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv gcc libpq-dev python3-dev python3-wheel
          sudo pip3 install wheel pylode==2.13.2 rdflib

      - name: Generate ontology documentation
        run: |
          mkdir -p ont-output
          cd ont-output
          echo "Generating pyLODE documentation for bb5kbc ontology"
          pylode -i ../ontology/bb5kbc-ontology.ttl -o index.html
          # Diagramm-Bild mitnehmen, damit pyLODE es relativ findet
          cp ../ontology/bb-5kbc-ontology.jpg ./bb-5kbc-ontology.jpg
          # Post-process: Platzhalter "Pictures say 1,000 words" durch echtes Bild ersetzen
          sed -i 's|<div style="width:500px; height:50px; background-color: lightgrey; border:solid 2px grey; padding:10px;margin-bottom:5px; text-align:center;">Pictures say 1,000 words</div>|<img src="bb-5kbc-ontology.jpg" alt="bb5kbc ontology overview" style="max-width:100%;height:auto;">|' index.html
          ls -la

      - name: Deploy to gh-pages /ontology/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: ont-output
          target-folder: ontology
          clean: false
          commit-message: "Update ontology documentation"
